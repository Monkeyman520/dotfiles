# --- 搜索行为 ---
search_mode = "daemon-fuzzy"
filter_mode = "global"

# 上箭头更像“项目内历史补全”
filter_mode_shell_up_key_binding = "directory"
search_mode_shell_up_key_binding = "daemon-fuzzy"

# 让 workspace 模式可用（git 仓库里很有用）
workspaces = true

# --- UI 风格：更接近 fzf 的紧凑感 ---
style = "compact"
inline_height = 18
inline_height_shell_up_key_binding = 10
invert = true
show_preview = true
max_preview_height = 3
show_help = false
show_tabs = false
auto_hide_height = 6
show_numeric_shortcuts = false

# --- 退出/接受行为 ---
exit_mode = "return-original"
enter_accept = false

# --- mac 上更舒服 ---
ctrl_n_shortcuts = true

# --- 初始模式：直接 vim insert ---
keymap_mode = "vim-insert"
keymap_cursor = { vim_normal = "steady-block", vim_insert = "blink-bar", emacs = "blink-block" }

# --- daemon-fuzzy：更快，且更偏“常用 + 最近” ---
[daemon]
enabled = true
autostart = true

[search]
filters = ["global", "workspace", "directory", "session"]
recency_score_multiplier = 1.5
frequency_score_multiplier = 1.2
frecency_score_multiplier = 1.8

# --- vim normal 模式 ---
[keymap.vim-normal]
"j" = "next"
"k" = "previous"
"down" = "next"
"up" = "previous"

# 类 vim / fzf：回车先带回 shell，不直接跑
"enter" = "return-selection"
"tab" = "accept"

# 更顺手的退出
"q" = "return-original"
"ctrl-c" = "return-original"

# 常见 vim 切模式
"i" = "switch-vim-insert"
"a" = "switch-vim-insert"
"/" = "switch-vim-insert"

# 像 less/vim 一样翻页
"ctrl-d" = "half-page-down"
"ctrl-u" = "half-page-up"
"g" = "first"
"G" = "last"

# 选中后像 fzf 一样快速确认
"l" = "return-selection"

# --- vim insert 模式 ---
[keymap.vim-insert]
"enter" = "return-selection"
"tab" = "accept"
"ctrl-c" = "return-original"

# 输入框开头时，左键直接退出；否则正常左移
"left" = [
  { when = "cursor-at-start", action = "return-original" },
  { action = "cursor-left" }
]

# 输入为空时 ctrl-d 退出，否则删字符
"ctrl-d" = [
  { when = "input-empty", action = "return-original" },
  { action = "delete-char-after" }
]
